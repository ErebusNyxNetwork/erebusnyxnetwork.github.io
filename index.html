<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="ErebusNyx">
  <title>ErebusNyx</title>
  <link rel="icon" type="image/png" href="/assets/icon-32.png">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #000; }
    body { min-height: 100svh; display: grid; place-items: center; color: #f0dcfa; font-family: Georgia, 'Times New Roman', serif; }
    main { width: min(94vw, 780px); text-align: center; padding: 36px 16px 56px; }
    img { display: block; width: min(100%, 650px); height: auto; margin: 0 auto 12px; }
    h1 { margin: 0; font-weight: 400; font-size: clamp(2.5rem, 8vw, 5rem); letter-spacing: .045em; }
    p { margin: 18px 0 0; font-size: clamp(1.1rem, 3vw, 1.7rem); color: #d7b6e5; letter-spacing: .025em; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/nyx-hero.png" alt="Nyx with violet wings beneath a crescent moon" width="756" height="603">
    <h1>ErebusNyx</h1>
    <p>Unveiling from the Shadows.</p>
  </main>
</body>
</html>
